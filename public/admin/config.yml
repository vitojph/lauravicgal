backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "public/images/blog"
public_folder: "/images/blog"

collections:
  - name: "blog"
    label: "Blog"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Title (Spanish)", name: "titleEs", widget: "string", required: false }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Description (Spanish)", name: "descriptionEs", widget: "string", required: false }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - label: "Content Blocks"
        name: "blocks"
        widget: "list"
        required: false
        types:
          - label: "Heading"
            name: "heading"
            widget: "object"
            fields:
              - { label: "Level", name: "level", widget: "select", options: ["h2", "h3"], default: "h2" }
              - { label: "Text", name: "text", widget: "string" }
          - label: "Text"
            name: "text"
            widget: "object"
            fields:
              - { label: "Text", name: "text", widget: "markdown", buttons: ["bold", "italic", "link", "bulleted-list", "numbered-list", "quote"], editor_components: [] }
          - label: "Image"
            name: "image"
            widget: "object"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Alt text", name: "alt", widget: "string", required: false }
              - { label: "Caption", name: "caption", widget: "string", required: false }
          - label: "Image Row (2-3 side by side)"
            name: "image-row"
            widget: "object"
            fields:
              - { label: "Images", name: "images", widget: "list", min: 2, max: 3, fields: [{ label: "Image", name: "image", widget: "image" }] }
              - { label: "Caption", name: "caption", widget: "string", required: false }
          - label: "Quote"
            name: "quote"
            widget: "object"
            fields:
              - { label: "Quote", name: "text", widget: "text" }
              - { label: "Attribution", name: "attribution", widget: "string", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
